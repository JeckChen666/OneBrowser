# 生产部署栈（V0.4-C，文档见同目录 production.md）
# 用法：cp .env.example .env && 按需改密钥 && docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onebrowser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置}
      POSTGRES_DB: onebrowser
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onebrowser -d onebrowser"]
      interval: 5s
      timeout: 3s
      retries: 30
    # 不暴露端口到宿主（仅 compose 网内访问）；备份经 docker compose exec

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8787"
      DATABASE_URL: postgres://onebrowser:${POSTGRES_PASSWORD}@postgres:5432/onebrowser?sslmode=disable
      # 对象存储：生产用托管 S3/R2/OSS；「极简单机」可改回本地 MinIO（见 production.md）
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-onebrowser-snapshots}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
      # 治理（默认值见 server/internal/config/config.go）
      SNAPSHOT_RETENTION: ${SNAPSHOT_RETENTION:-5}
      USER_QUOTA_GB: ${USER_QUOTA_GB:-2}
      AUTH_RATE_PER_MIN: ${AUTH_RATE_PER_MIN:-20}
      GEO_API: ${GEO_API:-}
      # 运维工作台（https://<DOMAIN>/admin/；留空=不开放）
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    expose:
      - "8787" # 仅经 caddy 反代对外

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 设置对外域名}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # ACME 证书（务必持久化，避免反复签发触发限频）
      - caddy-config:/config

volumes:
  pgdata-prod:
  caddy-data:
  caddy-config:
